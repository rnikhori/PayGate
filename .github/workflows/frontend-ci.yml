name: Frontend CI

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - "Makefile"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - "Makefile"

jobs:
  lint-typecheck-test-build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app: [dashboard, admin, checkout-widget]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # Caches npm's download cache between runs, keyed on each app's
          # own lockfile so one app's dependency bump doesn't invalidate
          # the others' cache.
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json

      # Each step below runs through the same Makefile target a contributor
      # would call locally (e.g. `make lint-frontend-app APP=dashboard`), so
      # CI and local dev never drift apart. The targets `cd` into
      # frontend/${{ matrix.app }} themselves and each (re-)installs deps
      # via `npm ci` first, so this is safe to re-run.
      - name: Install dependencies
        run: make install-frontend-app APP=${{ matrix.app }}

      - name: Lint
        run: make lint-frontend-app APP=${{ matrix.app }}

      - name: Typecheck
        run: make typecheck-frontend-app APP=${{ matrix.app }}

      - name: Test
        run: make test-frontend-app APP=${{ matrix.app }}

      - name: Build
        run: make build-frontend-app APP=${{ matrix.app }}
